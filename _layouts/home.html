---
layout: personal
---
<div class="profile-grid">
  <aside class="profile-photo" aria-label="Photo and contact links">
    {% include personal/profile.html %}
  </aside>
  <section class="profile-intro" aria-label="About Gabriel">
    <div class="markdown-content">{{ content }}</div>
    <div class="country-flags" aria-label="Brazil and Spain">
      <img src="https://hatscripts.github.io/circle-flags/flags/br.svg" alt="Brazil" width="25" height="25">
      <span aria-hidden="true">&#8644;</span>
      <img src="https://hatscripts.github.io/circle-flags/flags/es.svg" alt="Spain" width="25" height="25">
    </div>
    <a class="text-action" href="{{ site.data.profile.cv | relative_url }}">View my CV <span aria-hidden="true">↗</span><span class="sr-only"> (PDF)</span></a>
  </section>
</div>
<div class="homepage-research" aria-label="Research">
  {% include personal/research-list.html categories='working-paper,work-in-progress,paper' show_empty='work-in-progress' %}
</div>
