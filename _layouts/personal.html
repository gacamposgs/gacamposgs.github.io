---
---
<!doctype html>
<html lang="{{ site.locale | default: 'en' | slice: 0, 2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include base_path %}
    {% include seo.html %}
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include personal/header.html %}
    <main id="main-content" class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} {{ site.data.profile.name | escape }}</span>
      <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
    </footer>
  </body>
</html>
