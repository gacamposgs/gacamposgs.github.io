<header class="site-header">
  {% if page.url == '/' %}
    <h1 class="site-name">{{ site.data.profile.name | escape }}</h1>
  {% else %}
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name | escape }}</a>
  {% endif %}
  <p class="site-tagline">{{ site.data.profile.tagline | escape }}</p>
  <nav class="site-navigation" aria-label="Main navigation">
    {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a>
    {% endfor %}
  </nav>
</header>
